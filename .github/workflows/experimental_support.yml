name: Test upcoming versions
on:
  push:
    branches:
      - 'master'
  pull_request: {}

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '4.0'
            gemfile: rails_edge
          - ruby: head
            gemfile: rails_8_1
          - ruby: head
            gemfile: rails_edge
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@v3

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          bundler-cache: true
          rubygems: 4.0.23
          ruby-version: ${{ matrix.ruby }}

      - name: Migrate DB
        run: bin/rake app:db:migrate

      - name: Prepare DB
        run: bin/rake app:db:test:prepare

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Run spec
        run: bin/rspec

      # A failed example of a feature spec saves the HTML and an image of its page. The artifact keeps
      # them, and the test log, so that a failure that only CI shows can be read.
      - name: Keep the captures of failed examples
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spec-failures-${{ matrix.ruby }}-${{ matrix.gemfile }}
          path: |
            spec/dummy/tmp/capybara
            spec/dummy/log/test.log
          if-no-files-found: ignore
          retention-days: 7
